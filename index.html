<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="only light"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><meta name="referrer" content="no-referrer"><title>私人旅行檔案</title><link rel="stylesheet" href="shell.css"><script src="capsule-config.js" defer></script><script src="shell.js" defer></script></head><body><main id="surface" hidden><h1>私人旅行檔案</h1><p>公開入口不含旅行畫面或資料。請選擇自己保管的加密旅行包；解鎖只在此裝置完成，不上傳檔案或密語。</p><p>舊 APP 網域的帳本不會自動搬來。兩邊資料各自保留；沒有舊網域加密備份時，不要把新頁面當作已完成資料移轉。</p><label>私人旅行包<input id="capsuleFile" type="file" accept=".busanapp"></label><label>旅行包密語<input id="capsulePass" type="password" autocomplete="off" spellcheck="false"></label><label class="consent"><input id="consent" type="checkbox">我確認要在此裝置保存這份加密旅行包；不覆寫其他資料。</label><button id="install" type="button">檢查並安裝旅行包</button><button id="unlock" type="button">解鎖已保存旅行包</button><button id="lock" type="button">鎖住旅行包（保留資料）</button><button id="update" type="button" hidden>同意更新載入器</button><p id="status" role="status">正在檢查安全來源…</p><p>密語不保存。離開共用裝置前請按「鎖住旅行包」；記憶體解鎖最長8小時，瀏覽器回收記憶體後需再次解鎖；忘記旅行包密語不等於能復原私帳 PIN。請另行保存裝置資料的加密備份。</p></main><p id="unavailable">正在檢查安全環境；尚未讀取任何旅行資料。</p></body></html>
