name: V46 Itinerary Persistence and No-Resurrection
on:
  push:
    branches: [v46-ticket-crud-repair-20261021]
    paths:
      - '.github/workflows/v46-itinerary-integrity.yml'
      - 'js/app.js'
      - 'js/itinerary.js'
      - 'tests/v46-itinerary-durability.spec.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  itinerary-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: chromium, browser: chromium}
          - {project: mobile-chrome, browser: chromium}
          - {project: webkit, browser: webkit}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          npm install -g serve
          serve -s . -l 8080 &
          sleep 3
          curl -fsS http://localhost:8080/ >/dev/null
      - name: Strict isolated itinerary save/delete regression
        run: |
          npx playwright test tests/v46-itinerary-durability.spec.js \
            --project=${{ matrix.project }} --workers=1 --retries=0 --reporter=html,list
        env:
          CI: 'true'
          BUSAN_CI_FIREBASE_ISOLATED: '1'
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v46-itinerary-integrity-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
