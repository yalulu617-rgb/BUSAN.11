name: V46 OWNER Integrated Fit — real app evidence
on:
  push:
    branches: [v46-visual-rebuild-safe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-owner-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: 'npm'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Screenshot real V46 APP with isolated fixture
        env:
          CI: 'true'
          BUSAN_CI_FIREBASE_ISOLATED: '1'
        run: npx playwright test tests/v46-owner-integrated.spec.js --project=chromium --workers=1 --reporter=list
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: V46-owner-actual-app-320-360-390-430
          path: |
            visual-review/
            test-results/
          retention-days: 14
