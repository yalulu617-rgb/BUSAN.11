name: V46 Personal Data Integrity and Reload Gate
on:
  push:
    branches: [v46-ticket-crud-repair-20261021]
    paths:
      - '.github/workflows/v46-data-durability.yml'
      - 'tests/v46-data-durability.spec.js'
      - 'tests/fixtures/ci-firebase.js'
      - 'js/memory.js'
      - 'services/utils.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-data-integrity:
    name: Personal data / ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: chromium, browser: chromium}
          - {project: mobile-chrome, browser: chromium}
          - {project: mobile-safari, browser: webkit}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start local test site
        run: |
          npm install -g serve
          serve -s . -l 8080 &
          sleep 3
          curl -fsS http://localhost:8080/ >/dev/null
      - name: Require isolation, test reload/photo failure without retries
        run: |
          npx playwright test tests/v46-data-durability.spec.js \
            --project=${{ matrix.project }} --workers=1 --retries=0 --reporter=html,list
        env:
          CI: 'true'
          BUSAN_CI_FIREBASE_ISOLATED: '1'
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          PLAYWRIGHT_HTML_OPEN: never
      - name: Keep QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v46-durability-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
