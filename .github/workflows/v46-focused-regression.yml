name: V46 Focused Regression Evidence

on:
  push:
    branches: [v46-ticket-crud-repair-20261021]
    paths:
      - '.github/workflows/v46-focused-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start test server
        run: |
          npm install -g serve
          serve -s . -l 8080 &
          sleep 3
          curl -fsS http://localhost:8080/ >/dev/null
      - name: Validate original failures and 200pct touch without retries
        run: |
          npx playwright test tests/main.spec.js tests/owner-fix-batch2-repair3.spec.js tests/v46-compact-owner-preview.spec.js tests/accessibility.spec.js \
            --project=chromium --workers=1 --retries=0 \
            --grep 'Add Ticket form exists|Ticket shows all canonical reservations|compact V46 owner interactive screenshots|320px: three phases' \
            --reporter=html,list
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          BUSAN_CI_FIREBASE_ISOLATED: '1'
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v46-focused-regression-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
