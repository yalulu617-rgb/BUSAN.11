name: V46 Compact OWNER — real UI screenshots
on:
  push:
    branches: [v46-compact-home-owner-review-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: 'npm'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test compact UI against isolated real APP
        env:
          CI: 'true'
          BUSAN_CI_FIREBASE_ISOLATED: '1'
        run: npx playwright test tests/v46-compact-owner-preview.spec.js tests/v46-sticky-owner-preview.spec.js --project=chromium --workers=1 --reporter=list
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compact-owner-real-app-screenshots
          path: |
            visual-compact/
            visual-sticky/
            test-results/
          retention-days: 14
