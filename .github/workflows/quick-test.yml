name: Playwright Tests (Local Verify)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/**'
      - 'playwright.config.js'
      - '*.html'
      - 'js/**'
      - 'ute/**'
      - 'components/**'
      - 'data/**'
      - 'services/**'

jobs:
  test-chromium-only:
    name: 🎭 Quick Verify (Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          npm install -g serve
          serve -s . -l 8080 &
          sleep 3
      - run: npx playwright test --project=chromium --reporter=html,list
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          BUSAN_CI_FIREBASE_ISOLATED: '1'
          CI: true
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quick-test-report
          path: playwright-report/
          retention-days: 7
