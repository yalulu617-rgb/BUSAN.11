name: Playwright Tests (Local Verify)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/**'
      - 'playwright.config.js'
      - '*.html'
      - 'js/**'
      - 'ute/**'
      - 'components/**'
      - 'data/**'
      - 'services/**'

jobs:
  test-chromium-only:
    name: 🎭 Quick Verify (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          npm install -g serve
          serve -s . -l 8080 &
          sleep 3
      - run: npx playwright test --project=chromium --reporter=list
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-test-report
          path: playwright-report/
          retention-days: 7
