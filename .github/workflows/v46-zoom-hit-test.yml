name: V46 Zoom Hit-Test Evidence
on:
  push:
    branches: [v46-ticket-crud-repair-20261021]
    paths:
      - '.github/workflows/v46-zoom-hit-test.yml'
      - 'tests/accessibility.spec.js'
      - 'assets/css/v46-compact-layout.css'
      - 'style.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zoom-hit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: mobile-chrome, browser: chromium}
          - {project: webkit, browser: webkit}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          npm install -g serve
          serve -s . -l 8080 &
          sleep 3
          curl -fsS http://localhost:8080/ >/dev/null
      - name: Run real 200-percent zoom hit tests without retries
        run: npx playwright test tests/accessibility.spec.js --project=${{ matrix.project }} --workers=1 --retries=0 --grep '320px: three phases reflow' --reporter=list
        env:
          CI: 'true'
          BUSAN_CI_FIREBASE_ISOLATED: '1'
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v46-zoom-evidence-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
