name: V45 Quality Gate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: Syntax & Static Validation
  # ─────────────────────────────────────────────────────
  static-validation:
    name: 🔍 Static Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate JS syntax (including V46 engines and renderer)
        run: |
          node -e "
          const fs = require('fs');
          const files = [
            'ute/ute_storage.js','ute/ute_network.js','ute/ute_knowledge.js',
            'ute/ute_place.js','ute/ute_city.js','ute/ute_weather.js',
            'ute/ute_navigation.js','ute/ute_budget.js','ute/ute_ai.js',
            'ute/ute_context.js','ute/ute_main.js','ute/ute_home_v46.js',
            'ute/ute_shopping_photo.js','ute/ute_private_ledger.js','ute/ute_pwa_install.js',
            'services/nearby.js','services/utils.js','services/item-images.js',
            'data/recommended.js',
            'js/firebase.js','js/ui.js','js/wallet.js',
            'js/memory.js','js/itinerary.js','js/app.js',
            'components/v46-home.js','components/renderers.js'
          ];
          let pass = 0; let fail = 0;
          files.forEach(f => {
            try {
              new Function(fs.readFileSync(f, 'utf8'));
              console.log('✅ OK:', f);
              pass++;
            } catch(e) {
              console.error('❌ ERR:', f, e.message);
              fail++;
            }
          });
          console.log('\n--- Syntax Result: PASS=' + pass + ' FAIL=' + fail + ' ---');
          if (fail > 0) process.exit(1);
          "

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('✅ manifest.json valid');"

      - name: Verify release metadata stamping
        run: node tests/release-metadata.test.mjs

      - name: Validate data/places.json
        run: node -e "JSON.parse(require('fs').readFileSync('data/places.json','utf8')); console.log('✅ places.json valid');"

      - name: Validate data/restaurants.json
        run: node -e "JSON.parse(require('fs').readFileSync('data/restaurants.json','utf8')); console.log('✅ restaurants.json valid');"

      - name: Validate data/hotels.json
        run: node -e "JSON.parse(require('fs').readFileSync('data/hotels.json','utf8')); console.log('✅ hotels.json valid');"

      - name: Validate data/tickets.json
        run: node -e "JSON.parse(require('fs').readFileSync('data/tickets.json','utf8')); console.log('✅ tickets.json valid');"

      - name: Check critical assets exist
        run: |
          test -f index.html && echo "✅ index.html exists"
          test -f style.css && echo "✅ style.css exists"
          test -f sw.js && echo "✅ sw.js exists"
          test -f manifest.json && echo "✅ manifest.json exists"
          test -f icon.png && echo "✅ icon.png exists"
          test -f 13972.png && echo "✅ 13972.png (Doraemon hero) exists"
          test -f assets/images/v46-watercolor-hero-atlas.webp && echo "✅ V46 watercolor art exists"
          test -f assets/images/v46-during-characters.webp && echo "✅ V46 corrected train artwork exists"

      - name: Verify UNSAFE venues removed from itinerary
        run: |
          node -e "
          const content = require('fs').readFileSync('data/recommended.js', 'utf8');
          // Thrill On The Mug must be marked UNSAFE, not as active destination
          const lines = content.split('\n');
          let thrillLines = lines.filter(l => l.includes('Thrill On The Mug') && !l.includes('[UNSAFE]') && !l.includes('UNSAFE'));
          if (thrillLines.length > 0) {
            console.error('❌ BLOCKED: Thrill On The Mug (permanently closed 2026-06-06) appears as active venue');
            thrillLines.forEach(l => console.error('   ', l.trim()));
            process.exit(1);
          }
          console.log('✅ Venue safety check passed - no permanently closed venues in active itinerary');
          "

  # ─────────────────────────────────────────────────────
  # JOB 2: Playwright E2E Browser Tests
  # ─────────────────────────────────────────────────────
  e2e-tests:
    name: 🎭 E2E Browser Tests (${{ matrix.project }})
    needs: static-validation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            workers: ''
          - project: firefox
            workers: '--workers=1'
          - project: webkit
            workers: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (${{ matrix.project }} only)
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Start local HTTP server
        run: |
          npm install -g serve
          serve -s . -l 8080 &
          echo "Waiting for server..."
          sleep 3
          curl -f http://localhost:8080/ || (echo "❌ Server failed to start" && exit 1)
          echo "✅ Server running on port 8080"

      - name: Run Playwright E2E tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }} ${{ matrix.workers }} --reporter=html,list
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          BUSAN_CI_FIREBASE_ISOLATED: '1'
          CI: true
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test screenshots (failures only)
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.project }}
          path: test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────
  # JOB 3: V46 mobile/tablet & offline release acceptance (CI-only fixtures)
  # ─────────────────────────────────────────────────────
  v46-mobile-acceptance:
    name: 📱 V46 Acceptance (${{ matrix.device }})
    needs: static-validation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: android-360
            project: mobile-chrome
            browser: chromium
            width: 360
            height: 780
          - device: android-390
            project: mobile-chrome
            browser: chromium
            width: 390
            height: 844
          - device: iphone-safari-390
            project: mobile-safari
            browser: webkit
            width: 390
            height: 844
          - device: ipad-webkit-834
            project: tablet
            browser: webkit
            width: 834
            height: 1112
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start isolated HTTP test server
        run: |
          npm install -g serve
          serve -s . -l 8080 &
          sleep 3
          curl -f http://localhost:8080/ >/dev/null
      - name: Run V46 mobile, legacy-data and offline acceptance
        run: npx playwright test tests/v46-release-acceptance.spec.js --project=${{ matrix.project }} --workers=1 --reporter=html,list
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          BUSAN_CI_FIREBASE_ISOLATED: '1'
          CI: true
          PLAYWRIGHT_HTML_OPEN: never
          V46_QA_WIDTH: ${{ matrix.width }}
          V46_QA_HEIGHT: ${{ matrix.height }}
      - name: Save real browser screenshots and HTML report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v46-mobile-acceptance-${{ matrix.device }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────
  # Firefox responsive 320/360/390/430 + 200% text acceptance.
  # This replaces the inaccessible one-off private QA workflow; Playwright
  # screenshots are configured in playwright.config.js, not via unsupported CLI.
  # Isolated CI memory fixtures only; no production Firebase writes.
  # ─────────────────────────────────────────────────────
  firefox-mobile-zoom-qa:
    name: "🦊 Firefox 320-430px / 200% Text QA"
    needs: static-validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout V46 PR branch
        uses: actions/checkout@v5
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Install Firefox for Playwright
        run: npx playwright install --with-deps firefox
      - name: Start isolated local server
        run: |
          npm install -g serve
          serve -s . -l 8080 &
          sleep 3
          curl -f http://localhost:8080/ >/dev/null
      - name: Run Firefox responsive + 200% text regression
        run: npx playwright test tests/accessibility.spec.js --project=firefox --grep "MOBILE-ZOOM-01" --workers=1 --reporter=html,list
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          BUSAN_CI_FIREBASE_ISOLATED: '1'
          CI: true
          PLAYWRIGHT_HTML_OPEN: never
      - name: Preserve HTML report, screenshots, and traces
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v46-firefox-responsive-zoom-qa
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────
  # JOB 3: Accessibility, UX & Travel Data Checks
  # ─────────────────────────────────────────────────────
  accessibility-ux-travel:
    name: ♿ UX, Travel Data & Accessibility
    needs: static-validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local HTTP server
        run: |
          npm install -g serve
          serve -s . -l 8080 &
          sleep 3

      - name: Run Accessibility, UX & Travel tests
        run: npx playwright test tests/accessibility.spec.js tests/ux.spec.js tests/travel.spec.js tests/critical.spec.js --project=chromium --reporter=html,list
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          BUSAN_CI_FIREBASE_ISOLATED: '1'
          PLAYWRIGHT_HTML_OPEN: never
          CI: true

      - name: Upload reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: accessibility-ux-report
          path: playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────
  # JOB 4: Deploy to GitHub Pages (ONLY when all tests pass)
  # ─────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: [static-validation, e2e-tests, accessibility-ux-travel, v46-mobile-acceptance, firefox-mobile-zoom-qa]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stamp deployed release metadata
        run: node scripts/stamp-release.mjs "$GITHUB_SHA"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Install production verification dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Post-deployment Live Site Verification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_URL: https://yalulu617-rgb.github.io/BUSAN.11/index.html
        run: node scripts/verify-production.mjs

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Quality Gate Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Static Validation: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests (Chromium, Firefox, WebKit): PASS" >> $GITHUB_STEP_SUMMARY
          echo "- Accessibility, UX & Travel Safety: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- Live Production Site Verification: PASS" >> $GITHUB_STEP_SUMMARY
