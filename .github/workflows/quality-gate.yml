name: V42 Quality Gate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: Syntax & Static Validation
  # ─────────────────────────────────────────────────────
  static-validation:
    name: 🔍 Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JS syntax (all 21 modules)
        run: |
          node -e "
          const fs = require('fs');
          const files = [
            'ute/ute_storage.js','ute/ute_network.js','ute/ute_knowledge.js',
            'ute/ute_place.js','ute/ute_city.js','ute/ute_weather.js',
            'ute/ute_navigation.js','ute/ute_budget.js','ute/ute_ai.js',
            'ute/ute_context.js','ute/ute_main.js',
            'services/nearby.js','services/utils.js',
            'data/recommended.js',
            'js/firebase.js','js/ui.js','js/wallet.js',
            'js/memory.js','js/itinerary.js','js/app.js',
            'components/renderers.js'
          ];
          let pass = 0; let fail = 0;
          files.forEach(f => {
            try {
              new Function(fs.readFileSync(f, 'utf8'));
              console.log('✅ OK:', f);
              pass++;
            } catch(e) {
              console.error('❌ ERR:', f, e.message);
              fail++;
            }
          });
          console.log('\n--- Syntax Result: PASS=' + pass + ' FAIL=' + fail + ' ---');
          if (fail > 0) process.exit(1);
          "

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('✅ manifest.json valid');"

      - name: Validate data/places.json
        run: node -e "JSON.parse(require('fs').readFileSync('data/places.json','utf8')); console.log('✅ places.json valid');"

      - name: Validate data/restaurants.json
        run: node -e "JSON.parse(require('fs').readFileSync('data/restaurants.json','utf8')); console.log('✅ restaurants.json valid');"

      - name: Validate data/hotels.json
        run: node -e "JSON.parse(require('fs').readFileSync('data/hotels.json','utf8')); console.log('✅ hotels.json valid');"

      - name: Validate data/tickets.json
        run: node -e "JSON.parse(require('fs').readFileSync('data/tickets.json','utf8')); console.log('✅ tickets.json valid');"

      - name: Check critical assets exist
        run: |
          test -f index.html && echo "✅ index.html exists"
          test -f style.css && echo "✅ style.css exists"
          test -f sw.js && echo "✅ sw.js exists"
          test -f manifest.json && echo "✅ manifest.json exists"
          test -f icon.png && echo "✅ icon.png exists"
          test -f 13972.png && echo "✅ 13972.png (Doraemon hero) exists"

      - name: Verify UNSAFE venues removed from itinerary
        run: |
          node -e "
          const content = require('fs').readFileSync('data/recommended.js', 'utf8');
          // Thrill On The Mug must be marked UNSAFE, not as active destination
          const lines = content.split('\n');
          let thrillLines = lines.filter(l => l.includes('Thrill On The Mug') && !l.includes('[UNSAFE]') && !l.includes('UNSAFE'));
          if (thrillLines.length > 0) {
            console.error('❌ BLOCKED: Thrill On The Mug (permanently closed 2026-06-06) appears as active venue');
            thrillLines.forEach(l => console.error('   ', l.trim()));
            process.exit(1);
          }
          console.log('✅ Venue safety check passed - no permanently closed venues in active itinerary');
          "

  # ─────────────────────────────────────────────────────
  # JOB 2: Playwright E2E Browser Tests
  # ─────────────────────────────────────────────────────
  e2e-tests:
    name: 🎭 E2E Browser Tests (${{ matrix.project }})
    needs: static-validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            workers: ''
          - project: firefox
            workers: '--workers=1'
          - project: webkit
            workers: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (${{ matrix.project }} only)
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Start local HTTP server
        run: |
          npm install -g serve
          serve -s . -l 8080 &
          echo "Waiting for server..."
          sleep 3
          curl -f http://localhost:8080/ || (echo "❌ Server failed to start" && exit 1)
          echo "✅ Server running on port 8080"

      - name: Run Playwright E2E tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }} ${{ matrix.workers }} --reporter=html,list
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test screenshots (failures only)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.project }}
          path: test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────
  # JOB 3: Accessibility, UX & Travel Data Checks
  # ─────────────────────────────────────────────────────
  accessibility-ux-travel:
    name: ♿ UX, Travel Data & Accessibility
    needs: static-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local HTTP server
        run: |
          npm install -g serve
          serve -s . -l 8080 &
          sleep 3

      - name: Run Accessibility, UX & Travel tests
        run: npx playwright test tests/accessibility.spec.js tests/ux.spec.js tests/travel.spec.js tests/critical.spec.js --project=chromium --reporter=list
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-ux-report
          path: playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────
  # JOB 4: Deploy to GitHub Pages (ONLY when all tests pass)
  # ─────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: [static-validation, e2e-tests, accessibility-ux-travel]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deployment Live Site Verification
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            console.log('--- Verifying Live Deployment: https://yalulu617-rgb.github.io/BUSAN.11/index.html ---');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            let pageErrors = [];
            page.on('pageerror', err => pageErrors.push(err.message));
            
            const url = 'https://yalulu617-rgb.github.io/BUSAN.11/index.html';
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
            if (!response || response.status() !== 200) {
              throw new Error('Live page returned HTTP ' + (response ? response.status() : 'null'));
            }
            console.log('✅ HTTP Status: 200 OK');

            await page.waitForSelector('#splash, #mainApp', { state: 'attached', timeout: 15000 });
            console.log('✅ App DOM attached');

            const btn = page.locator('.btn-enter');
            if (await btn.isVisible()) {
              await btn.click({ timeout: 2000 }).catch(() => {});
            }
            await page.waitForSelector('#mainApp', { state: 'visible', timeout: 15000 });
            console.log('✅ Main App visible');

            const cardCount = await page.locator('.v45-nine-card').count();
            console.log('✅ Home 9-Card count:', cardCount);
            if (cardCount !== 9) {
              throw new Error('Expected exactly 9 Home cards, found ' + cardCount);
            }

            const profileSel = page.locator('#deviceOwner');
            if (await profileSel.count() === 0) {
              throw new Error('Profile selector #deviceOwner not found in live DOM');
            }
            console.log('✅ Profile selector verified');

            if (pageErrors.length > 0) {
              throw new Error('Fatal page errors detected: ' + pageErrors.join('; '));
            }
            console.log('✅ 0 fatal page errors detected');
            console.log('🎉 Live Production Verification PASSED!');
            await browser.close();
          })().catch(e => {
            console.error('❌ Live site verification failed:', e.message);
            process.exit(1);
          });
          "

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Quality Gate Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Static Validation: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests (Chromium, Firefox, WebKit): PASS" >> $GITHUB_STEP_SUMMARY
          echo "- Accessibility, UX & Travel Safety: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- Live Production Site Verification: PASS" >> $GITHUB_STEP_SUMMARY
