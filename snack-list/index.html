<script>
(()=>{'use strict';
const KEY='busan.snacks.pwa.20261111.v1';const VERSION=1;
const PRODUCTS=[
{id:'coffee',name:'I’MINT Espresso 濃縮咖啡糖',spec:'5 罐｜咖啡糖',group:'coffee',qty:5,price:4600,owner:'同事代購',note:'參考價為韓國 5 罐組均攤 ₩4,600／罐'},
{id:'onion',name:'Orion 烤洋蔥',spec:'204g／12入',group:'chips',qty:1,price:3580,owner:'岳麗婷 ×1',note:''},
{id:'cheese2',name:'Orion 起司焗烤',spec:'64g／2入',group:'chips',qty:1,price:1700,owner:'岳麗婷 ×1',note:''},
{id:'cheese12',name:'Orion 起司焗烤',spec:'204g／12入',group:'chips',qty:1,price:2810,owner:'彭湘文 ×1',note:''},
{id:'chipotle',name:'Orion 煙燻辣椒美乃滋',spec:'76g／2入／盒',group:'chips',qty:4,price:1580,owner:'彭湘文 ×3、盧美如 ×1',note:'「2入」依訂購標示；請以實物確認'},
{id:'garlic',name:'Orion 蒜香青陽辣椒美乃滋',spec:'76g／2入／盒',group:'chips',qty:3,price:1580,owner:'彭湘文 ×3',note:'「2入」依訂購標示；請以實物確認'},
{id:'hbaf',name:'HBAF 山葵杏仁',spec:'120g／包',group:'personal',qty:2,price:3980,owner:'個人自購 ×2',note:'E-Mart 韓國網路參考 ₩3,980；蝦皮截圖 NT$148／包'}
];
const ORDERS=[
{person:'彭湘文',id:'coffee',qty:3},{person:'彭湘文',id:'cheese12',qty:1},{person:'彭湘文',id:'chipotle',qty:3},{person:'彭湘文',id:'garlic',qty:3},
{person:'岳麗婷',id:'coffee',qty:2},{person:'岳麗婷',id:'cheese2',qty:1},{person:'岳麗婷',id:'onion',qty:1},
{person:'盧美如',id:'chipotle',qty:1}
];
const PEOPLE=['彭湘文','岳麗婷','盧美如'];
let state={version:VERSION,rate:0.02459498,items:{},people:{}};
let tab='shopping',filter='all',hasStorage=true,toastTimer;
const pmap=Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
function init(){PRODUCTS.forEach(p=>{state.items[p.id]={bought:0,actualPrice:null,note:p.note,skip:false}});PEOPLE.forEach(n=>state.people[n]={paid:0,delivered:false});}
init();
function sanitize(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isNumber(v){return Number.isFinite(Number(v))&&v!==null&&v!=='';}
function num(v,limit=99999999){const x=Number(v);return Number.isFinite(x)?Math.max(0,Math.min(limit,x)):0;}
function isValidPrice(v){return v!==null && v!==undefined && v!=='' && Number.isFinite(Number(v));}
function getItem(p){return state.items[p.id]}
function hydrate(raw){if(!raw||typeof raw!=='object'||raw.version!==VERSION||!raw.items||!raw.people)throw Error('備份檔案版本不相容');const clean={version:VERSION,rate:typeof raw.rate==='number'&&raw.rate>0&&raw.rate<1?raw.rate:state.rate,items:{},people:{}};PRODUCTS.forEach(p=>{const s=raw.items[p.id]||{};clean.items[p.id]={bought:Math.floor(num(s.bought,999)),actualPrice:isValidPrice(s.actualPrice)?Math.floor(num(s.actualPrice)):null,note:typeof s.note==='string'?s.note.slice(0,1000):p.note,skip:!!s.skip}});PEOPLE.forEach(n=>{const s=raw.people[n]||{};clean.people[n]={paid:Math.floor(num(s.paid)),delivered:!!s.delivered}});return clean;}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)state=hydrate(JSON.parse(raw));localStorage.setItem(KEY,JSON.stringify(state));}catch(e){hasStorage=false;document.getElementById('saveState').textContent='瀏覽器未開放本機儲存，請使用「備份資料」保存';}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));hasStorage=true;document.getElementById('saveState').textContent='已自動儲存於這台裝置';}catch(e){hasStorage=false;document.getElementById('saveState').textContent='自動儲存不可用：請下載備份';}}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
const won=x=>'₩'+new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(Math.round(x||0));
const twd=x=>'NT$'+new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(Math.round(x||0));
function planned(p){return p.qty * p.price}
function hasPrice(p){return isValidPrice(getItem(p).actualPrice)}
function actual(p){const s=getItem(p);return hasPrice(p)?s.bought*s.actualPrice:0}
function metrics(){let qty=0,bought=0,pending=0,forecast=0,spent=0,missingPrice=0;PRODUCTS.forEach(p=>{const s=getItem(p);if(!s.skip){qty+=p.qty;bought+=Math.min(p.qty,s.bought);pending+=Math.max(0,p.qty-s.bought);}forecast+=planned(p);spent+=actual(p);if(s.bought>0&&!hasPrice(p))missingPrice++;});return {qty,bought,pending,forecast,spent,missingPrice};}
function personDetails(name){const lines=ORDERS.filter(x=>x.person===name).map(x=>({...x,p:pmap[x.id],s:state.items[x.id]}));const projectedKrw=lines.reduce((sum,o)=>sum+o.qty*o.p.price,0);const forecast=Math.round(projectedKrw*state.rate);
let complete=lines.every(o=>o.s.bought>=o.p.qty&&hasPrice(o.p));let known=lines.every(o=>hasPrice(o.p));let actualKrw=known?lines.reduce((sum,o)=>sum+o.qty*o.s.actualPrice,0):null;let actualTwd=known?Math.round(actualKrw*state.rate):null;
const paid=state.people[name].paid;return {lines,forecast,complete,known,actualTwd,paid,due:known?Math.max(0,actualTwd-paid):null};}
function statsHtml(){const m=metrics();return `<div class="stats"><div class="stat"><label>要買總數</label><strong>${m.qty} <small>件</small></strong><small>含個人 HBAF 2 包</small></div><div class="stat"><label>已買到</label><strong>${m.bought} <small>件</small></strong><small>依輸入數量自動累計</small></div><div class="stat"><label>尚未買到</label><strong>${m.pending} <small>件</small></strong><small>略過品項不計入</small></div><div class="stat"><label>已輸入實付</label><strong style="font-size:23px">${twd(m.spent*state.rate)}</strong><small>${won(m.spent)}${m.missingPrice?` · ${m.missingPrice} 款缺實價`:''}</small></div></div>`;}
function productCard(p){const s=getItem(p),missing=Math.max(p.qty-s.bought,0),done=s.bought>=p.qty&&hasPrice(p),partial=s.bought>0,percent=Math.min(100,p.qty?Math.round(s.bought/p.qty*100):100);let status=s.skip?'略過':done?'買齊':(partial?'採買中':'待採買');if(partial&&!hasPrice(p))status='待填價格';return `<article class="item ${done?'done':''} ${s.skip?'skipped':''}" data-id="${p.id}">
<div class="item-top"><div><h3>${sanitize(p.name)}</h3><div class="sub">${sanitize(p.spec)} · ${sanitize(p.owner)}</div></div><span class="flag ${done?'good':''} ${s.skip?'skip':''}">${status}</span></div>
<div class="meter" aria-label="${s.bought} / ${p.qty}"><span style="width:${percent}%"></span></div>
<div class="input-grid"><div class="field"><label for="count-${p.id}">已買數量 ／ 需要 ${p.qty}</label><div class="input-wrap"><input class="num editable" type="number" inputmode="numeric" min="0" max="999" step="1" id="count-${p.id}" data-field="bought" data-id="${p.id}" value="${s.bought}" aria-label="${p.name}已買數量"><div class="stepper"><button type="button" data-action="inc" data-id="${p.id}" aria-label="${p.name}增加一件">+</button><button type="button" data-action="dec" data-id="${p.id}" aria-label="${p.name}減少一件">−</button></div></div></div>
<div class="field"><label for="price-${p.id}">實際單價（韓幣）</label><input class="num editable" type="number" inputmode="numeric" min="0" max="99999999" step="1" id="price-${p.id}" data-field="actualPrice" data-id="${p.id}" value="${hasPrice(p)?s.actualPrice:''}" placeholder="例：${p.price}" aria-label="${p.name}實際單價"></div></div>
<div class="item-foot"><div>參考 ${won(p.price)}／件 · <span class="amount">${hasPrice(p)&&s.bought?twd(actual(p)*state.rate):'尚未計實付'}</span></div><button class="tiny-action" type="button" data-action="skip" data-id="${p.id}">${s.skip?'恢復採買':'這款不買'}</button></div>
<textarea class="notes" data-field="note" data-id="${p.id}" aria-label="${p.name}店家及備註" placeholder="在哪裡買／記下店家或其他備註">${sanitize(s.note)}</textarea></article>`;}
function shopping(){const m=metrics();const groups=[['coffee','☕','咖啡糖'],['chips','🥔','Orion 洋芋片'],['personal','🌰','個人採買']];let html=statsHtml()+`<div class="notice"><strong>採買方式：</strong>每款直接輸入「已買數量」＋「實際韓幣單價」。右邊的 + / − 可以快速加減。價格空白不會算成 0 元成交；兩款沾醬均按 <b>76g／2入／盒</b> 登記。</div><div class="switches"><button class="pill ${filter==='all'?'on':''}" data-filter="all">全部商品</button><button class="pill ${filter==='missing'?'on':''}" data-filter="missing">還沒買齊</button><button class="pill ${filter==='unpriced'?'on':''}" data-filter="unpriced">已買待填價</button></div>`;
for(const [id,emoji,name]of groups){const arr=PRODUCTS.filter(p=>p.group===id).filter(p=>filter==='all'||(filter==='missing'?(!getItem(p).skip&&getItem(p).bought<p.qty):(getItem(p).bought>0&&!hasPrice(p))));if(!arr.length)continue;html+=`<section class="group"><div class="group-name"><span class="emoji">${emoji}</span>${name}<span class="count">${arr.reduce((n,p)=>n+p.qty,0)} 件需求</span></div><div class="item-grid">${arr.map(productCard).join('')}</div></section>`}
if(!html.includes('class="item-grid"')) html+='<div class="empty">這個篩選沒有待處理項目，太好了 🍁</div>';
html+=`<section class="panel"><div class="section-title"><h2>這趟採買預算</h2></div><div class="line"><span>全清單原始參考總額（含 HBAF）</span><strong>${won(m.forecast)} · ${twd(m.forecast*state.rate)}</strong></div><div class="line"><span>目前填寫的實際花費</span><strong>${won(m.spent)} · ${twd(m.spent*state.rate)}</strong></div><div class="line"><span>尚有未填實價</span><strong>${m.missingPrice} 款</strong></div><div class="fine">預估價不是成交價。若同一款分兩次用不同價格購買，請以加權平均單價填入，或寫在備註；實際台幣金額依下方匯率換算。</div><div class="actions"><button class="action" data-action="backup">下載 JSON 備份</button><button class="action secondary" data-action="csv">輸出 CSV 清單</button></div></section>`;
return html;}
function people(){const details=PEOPLE.map(n=>({n,...personDetails(n)}));const totalForecast=details.reduce((n,p)=>n+p.forecast,0);const totalPaid=details.reduce((n,p)=>n+p.paid,0);const full=details.every(d=>d.known&&d.complete);const totalActual=details.reduce((n,p)=>n+(p.actualTwd||0),0);let html=`<div class="section-title"><h2>同事代購分帳</h2><span>3 位同事 · 不含 HBAF</span></div><div class="notice">同事應收以<b>全部訂單買齊、實價填妥</b>為正式結算條件。未買齊時即使已填價，也只會顯示暫估。可以在下方填實際收到的台幣，不會改動採買數量。</div><div class="stats"><div class="stat"><label>參考代購總額</label><strong style="font-size:23px">${twd(totalForecast)}</strong><small>按同事逐人合計換算</small></div><div class="stat"><label>實價應收（暫估）</label><strong style="font-size:23px">${twd(totalActual)}</strong><small>${full?'品項均已買齊':'若未填齊，總額尚未完整'}</small></div><div class="stat"><label>已收款</label><strong style="font-size:23px">${twd(totalPaid)}</strong><small>由分帳欄位手動登記</small></div><div class="stat"><label>尚待結算</label><strong>${details.filter(x=>!x.complete).length} <small>人</small></strong><small>未買齊／未填價者</small></div></div><div class="person-list">`;
for(const d of details){const confirmed=d.complete&&d.known;html+=`<article class="person-card"><div class="person-head"><h3>${d.n}</h3><small>${confirmed?'可結算':'採買尚未完成'}</small></div><div class="fine">訂購 ${d.lines.reduce((n,o)=>n+o.qty,0)} 件 · 參考 ${twd(d.forecast)}</div><div class="mini-lines">`;
for(const o of d.lines){html+=`<div class="mini-line"><span>${sanitize(o.p.name)} ×${o.qty}</span><span>${hasPrice(o.p)?twd(o.qty*o.s.actualPrice*state.rate):'待實價'}</span></div>`;}
html+=`</div><div class="person-total"><div><div class="fine">${d.known?(confirmed?'應收金額':'按實價暫估應收'):'參考應收'}</div><b>${twd(d.known?d.actualTwd:d.forecast)}</b></div><div class="fine" style="text-align:right">${d.known?`已收 ${twd(d.paid)}<div>待收 ${twd(Math.max(0,d.actualTwd-d.paid))}</div>`:'待商品買齊並填價'}</div></div><div class="settle"><div class="field"><label for="paid-${encodeURIComponent(d.n)}">已收到的台幣</label><input class="num editable" type="number" min="0" inputmode="numeric" data-person="${d.n}" data-person-field="paid" id="paid-${encodeURIComponent(d.n)}" value="${d.paid}"></div><label class="checkline"><input type="checkbox" data-person="${d.n}" data-person-field="delivered" ${state.people[d.n].delivered?'checked':''}> 已交付</label></div></article>`;}
html+=`</div><section class="panel"><h2>分帳原則</h2><p class="fine">每位同事的同一商品依實際韓幣單價計價，再按匯率換成台幣並四捨五入；同事全部訂單買齊前，金額仍屬暫估。個人 HBAF 不算入同事收款。</p><div class="actions"><button class="action secondary" data-action="peoplecsv">下載同事分帳 CSV</button><button class="action" data-action="backup">備份所有紀錄</button></div></section>`;return html;}
function help(){const m=metrics();return `<section class="panel help"><h2>離線使用方式</h2><div class="offline-ready">✓ 連線第一次開啟後，網頁可以安裝到手機主畫面並離線使用；採買及分帳資料只儲存於此裝置，不會同步到 Google 試算表。</div><ol><li>開啟 <strong>採買清單</strong>，每買到一件按 <strong>＋</strong>，或在黃色數量欄直接輸入。</li><li>把當下韓幣<strong>實際單價</strong>填在黃色價格欄；已買金額與缺少數量會自動更新。</li><li>切到 <strong>同事分帳</strong>，看每個人的品項、金額，並填已收款金額和是否交付。</li><li>每天回飯店或採買結束後按 <strong>備份 JSON</strong>。換裝置時按「載入備份」還原；另可下載 CSV 做留存。</li></ol><div class="notice"><strong>請注意：</strong>以 PWA 網址開啟後，本機資料由該瀏覽器的網站儲存空間保存。請定期下載 JSON 備份；瀏覽器清除網站資料、使用無痕模式或換手機時，紀錄可能無法保留。</div></section><section class="panel"><h2>備份與還原</h2><div class="csv-actions"><button class="action" data-action="backup">↓ 下載完整 JSON 備份</button><button class="action secondary" data-action="restore">↑ 載入 JSON 備份</button><button class="action secondary" data-action="csv">下載採買 CSV</button><button class="action secondary" data-action="peoplecsv">下載分帳 CSV</button><button class="action secondary" data-action="print">列印／另存 PDF</button></div><p class="fine">JSON 保留買到數量、價格、店家備註、收款與交付狀態；CSV 可交給 Excel 或 Google 試算表閱讀，但不能用 CSV 還原本網頁。</p><div class="line"><label for="rate">韓幣→台幣換算匯率（1 KRW = 幾 TWD）</label><input class="num editable" style="max-width:185px" id="rate" type="number" inputmode="decimal" step="0.00000001" min="0.00000001" max="0.999999" data-setting="rate" value="${state.rate}"></div><p class="fine">預設使用 2026/11/11 試算表參考值 0.024595。你可以改成真正換匯或刷卡結算的匯率；單機版不會自動抓即時行情。</p></section><section class="panel"><h2>資料狀態</h2><div class="line"><span>儲存方式</span><strong>${hasStorage?'本機自動儲存':'未開放自動儲存'}</strong></div><div class="line"><span>已買件數</span><strong>${m.bought} / ${m.qty}</strong></div><div class="line"><span>已填實價支出</span><strong>${twd(m.spent*state.rate)}</strong></div><div class="actions"><button class="action warn" data-action="reset">清空所有採買及收款紀錄</button></div><p class="fine">清空只影響這份網頁的本機紀錄，不影響你的 Google 試算表。清空前建議先備份。</p></section>`;}
function render(){const root=document.getElementById('view');root.innerHTML=tab==='shopping'?shopping():tab==='people'?people():help();document.querySelectorAll('[data-tab]').forEach(btn=>{let active=btn.dataset.tab===tab;btn.classList.toggle('selected',active);btn.setAttribute('aria-selected',active?'true':'false')});}
function saveAndRender(msg){persist();render();if(msg)toast(msg)}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function backup(){const stamp=new Date().toLocaleDateString('sv-SE');const data={...state,exportedAt:new Date().toISOString(),label:'BUSAN SNACK LIST'};download(`busan_snacks_backup_${stamp}.json`,JSON.stringify(data,null,2),'application/json;charset=utf-8');toast('完整 JSON 備份已產生')}
function csvLine(arr){return arr.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')}
function shopCsv(){const head=['品項','規格','原訂數量','已買數量','還差','韓幣參考單價','韓幣實際單價','實際韓幣小計','實際台幣小計','狀態','備註'];const rows=PRODUCTS.map(p=>{const s=getItem(p);return [p.name,p.spec,p.qty,s.bought,Math.max(0,p.qty-s.bought),p.price,hasPrice(p)?s.actualPrice:'',hasPrice(p)?actual(p):'',hasPrice(p)?Math.round(actual(p)*state.rate):'',s.skip?'略過':s.bought>=p.qty?'買齊':s.bought?'部分買到':'未買',s.note]});download('busan_snacks_shopping.csv','\ufeff'+[head,...rows].map(csvLine).join('\r\n'),'text/csv;charset=utf-8');toast('採買 CSV 已產生')}
function peopleCsv(){const head=['同事','品項','數量','參考韓幣單價','實際韓幣單價','預估台幣小計','實價台幣小計','每人已收款總額','是否交付'];const rows=ORDERS.map(o=>{const p=pmap[o.id],s=getItem(p),d=personDetails(o.person);return [o.person,p.name,o.qty,p.price,hasPrice(p)?s.actualPrice:'',Math.round(o.qty*p.price*state.rate),hasPrice(p)?Math.round(o.qty*s.actualPrice*state.rate):'',d.paid,state.people[o.person].delivered?'已交付':'未交付']});download('busan_snacks_colleagues.csv','\ufeff'+[head,...rows].map(csvLine).join('\r\n'),'text/csv;charset=utf-8');toast('分帳 CSV 已產生')}
function action(name,id){if(name==='inc'||name==='dec'){const s=state.items[id];s.bought=Math.max(0,Math.min(999,s.bought+(name==='inc'?1:-1)));saveAndRender();return}
if(name==='skip'){const s=state.items[id];s.skip=!s.skip;saveAndRender(s.skip?'已標記這款略過':'已恢復這款採買');return}
if(name==='backup')return backup();if(name==='csv')return shopCsv();if(name==='peoplecsv')return peopleCsv();if(name==='restore'){document.getElementById('restoreFile').click();return}if(name==='print'){window.print();return}
if(name==='reset'){if(confirm('確定清空所有採買數量、現場價格、備註與同事收款？這個操作無法復原（除非已有 JSON 備份）。')){init();saveAndRender('已清空本機紀錄')}return;}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-filter],[data-action]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});return}if(t.dataset.filter){filter=t.dataset.filter;render();return}if(t.dataset.action)action(t.dataset.action,t.dataset.id)});
document.addEventListener('change',e=>{const el=e.target;const id=el.dataset.id;if(id&&el.dataset.field){const s=state.items[id];if(el.dataset.field==='bought')s.bought=Math.floor(num(el.value,999));else if(el.dataset.field==='actualPrice')s.actualPrice=el.value.trim()===''?null:Math.floor(num(el.value));else if(el.dataset.field==='note')s.note=el.value.slice(0,1000);saveAndRender();return}if(el.dataset.person){const s=state.people[el.dataset.person];if(el.dataset.personField==='paid')s.paid=Math.floor(num(el.value));if(el.dataset.personField==='delivered')s.delivered=el.checked;saveAndRender();return}if(el.dataset.setting==='rate'){const n=Number(el.value);if(!Number.isFinite(n)||n<=0||n>=1){toast('匯率必須在 0 到 1 之間');render();return}state.rate=n;saveAndRender('匯率已更新')}});
document.getElementById('restoreFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const raw=JSON.parse(await f.text());const fresh=hydrate(raw);if(!confirm('載入備份會取代此裝置目前的採買、價格和收款紀錄。確定還原？')){e.target.value='';return}state=fresh;filter='all';tab='shopping';saveAndRender('備份還原成功')}catch(error){alert('這個檔案不是可用的 BUSAN JSON 備份。\n'+error.message)}finally{e.target.value=''}});
load();render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('離線安裝失敗',e)));}</script></body></html>
